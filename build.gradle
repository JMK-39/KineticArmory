import java.text.SimpleDateFormat

buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
 dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.24'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'

configurations.configureEach {
    resolutionStrategy.cacheDynamicVersionsFor 99999, 'days'
    resolutionStrategy.cacheChangingModulesFor 99999, 'days'
}

def getDynamicVersion() {
    def useAuto = project.findProperty('use_auto_version')?.toString() ?: 'false'
    if (useAuto.toBoolean()) {
        return new SimpleDateFormat("yy.M.d").format(new Date())
    } else {
        return project.findProperty('mod_version')?.toString() ?: "0.0.0"
    }
}

def pVersion = getDynamicVersion()
def pGroup   = project.findProperty('mod_group_id')?.toString() ?: "dev.xyat.kineticarmory"
def pModId   = project.findProperty('mod_id')?.toString() ?: "kineticarmory"

version = pVersion
group = pGroup

base {
    archivesName.set(pModId)
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: project.findProperty('mapping_channel')?.toString() ?: 'official', version: project.findProperty('mapping_version')?.toString()
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${pModId}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', pModId
        }

        server {
            property 'forge.enabledGameTestNamespaces', pModId
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.blamejared.com' }

    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    def kineticCoreLocalArtifactDirs = []
    File gradleHomeParent = gradle.gradleUserHomeDir.canonicalFile.parentFile
    if (gradleHomeParent != null) {
        File localPool = new File(gradleHomeParent, 'libs')
        if (localPool.isDirectory()) kineticCoreLocalArtifactDirs.add(localPool)
    }
    File localCoreBuildLibs = rootProject.file('../KineticCore/build/libs')
    if (localCoreBuildLibs.isDirectory()) kineticCoreLocalArtifactDirs.add(localCoreBuildLibs)
    if (!kineticCoreLocalArtifactDirs.isEmpty()) {
        flatDir {
            name = 'KineticCoreLocalPool'
            dirs kineticCoreLocalArtifactDirs
            content { includeModule 'dev.xyat.kineticcore', 'kineticcore' }
        }
    }
    ivy {
        name = 'KineticCoreGitHubReleases'
        url = 'https://github.com/JMK-39/KineticCore/releases/download'
        patternLayout { artifact 'v[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'dev.xyat.kineticcore', 'kineticcore' }
    }
}


apply from: 'gradle/kinetic-addon-reobf-verification.gradle'

dependencies {
    minecraft "net.minecraftforge:forge:${project.findProperty('minecraft_version')?.toString()}-${project.findProperty('forge_version')?.toString()}"

    project.configurations.configureEach { configuration ->
        if (configuration.name == 'compileClasspath' || configuration.name == 'runtimeClasspath' || configuration.name == 'kineticCoreReobf') {
            configuration.resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        }
    }
    def kineticCoreMinimumVersion = project.findProperty('kineticcore_min_version')?.toString() ?: '26.9.28'
    // Compare local KineticCore JARs with GitHub's latest stable release; prefer local unless the official version is newer.
    def kineticCoreVersion = project.findProperty('kineticcore_resolved_version')?.toString() ?: project.findProperty('kineticcore_version')?.toString()
    def parseKineticCoreVersion = { String value ->
        def parts = value.replaceFirst(/^v/, '').tokenize('.')
        if (parts.size() < 3 || parts.any { part -> !(part ==~ /\d+/) }) {
            throw new org.gradle.api.GradleException("Invalid KineticCore version '${value}'.")
        }
        parts.collect { it.toBigInteger() }
    }
    def compareKineticCoreVersions = { String left, String right ->
        def leftParts = parseKineticCoreVersion(left)
        def rightParts = parseKineticCoreVersion(right)
        for (int index = 0; index < Math.max(leftParts.size(), rightParts.size()); index++) {
            int comparison = (index < leftParts.size() ? leftParts[index] : 0) <=>
                    (index < rightParts.size() ? rightParts[index] : 0)
            if (comparison != 0) return comparison
        }
        return 0
    }

    def localKineticCoreDirs = []
    File localGradleHomeParent = gradle.gradleUserHomeDir.canonicalFile.parentFile
    if (localGradleHomeParent != null) {
        File localPool = new File(localGradleHomeParent, 'libs')
        if (localPool.isDirectory()) localKineticCoreDirs.add(localPool)
    }
    File localCoreBuildLibs = rootProject.file('../KineticCore/build/libs')
    if (localCoreBuildLibs.isDirectory()) localKineticCoreDirs.add(localCoreBuildLibs)
    def localKineticCoreVersions = []
    localKineticCoreDirs.each { File directory ->
        directory.eachFile { File jar ->
            def match = jar.name =~ /^kineticcore-(\d+(?:\.\d+){2,})\.jar$/
            if (jar.isFile() && match.matches()) localKineticCoreVersions.add(match.group(1))
        }
    }
    def localKineticCoreVersion = localKineticCoreVersions.isEmpty() ? null :
            localKineticCoreVersions.max { left, right -> compareKineticCoreVersions(left, right) }

    if (!kineticCoreVersion) {
        String latestOfficialVersion = null
        def latestRelease = null
        def connection = (java.net.HttpURLConnection) new java.net.URL(
                'https://api.github.com/repos/JMK-39/KineticCore/releases/latest').openConnection()
        connection.connectTimeout = 10000
        connection.readTimeout = 10000
        connection.setRequestProperty('Accept', 'application/vnd.github+json')
        connection.setRequestProperty('User-Agent', 'KineticCore-Gradle-Version-Resolver')
        try {
            if (connection.responseCode != 200) {
                throw new org.gradle.api.GradleException("GitHub returned HTTP ${connection.responseCode}.")
            }
            latestRelease = connection.inputStream.withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            latestOfficialVersion = latestRelease.tag_name.toString().replaceFirst(/^v/, '')
            parseKineticCoreVersion(latestOfficialVersion)
        } catch (Exception exception) {
            if (!localKineticCoreVersion) {
                throw new org.gradle.api.GradleException(
                        'Could not resolve the latest stable KineticCore release from GitHub and no local KineticCore JAR is available. Set -Pkineticcore_version=<verified-version> or restore network access.',
                        exception)
            }
            logger.warn("Could not check the latest KineticCore release; using local KineticCore ${localKineticCoreVersion}: ${exception.message}")
        } finally {
            connection.disconnect()
        }

        if (latestOfficialVersion && (!localKineticCoreVersion ||
                compareKineticCoreVersions(latestOfficialVersion, localKineticCoreVersion) > 0) &&
                !(latestRelease?.assets ?: []).any { asset ->
                    asset.name == "kineticcore-${latestOfficialVersion}.jar"
                }) {
            throw new org.gradle.api.GradleException(
                    "Newer KineticCore release ${latestOfficialVersion} has no matching JAR asset.")
        }

        if (latestOfficialVersion && localKineticCoreVersion &&
                compareKineticCoreVersions(localKineticCoreVersion, latestOfficialVersion) >= 0) {
            kineticCoreVersion = localKineticCoreVersion
            logger.lifecycle("Using local KineticCore ${kineticCoreVersion}; GitHub latest is ${latestOfficialVersion}. No official JAR download is needed.")
        } else if (latestOfficialVersion) {
            kineticCoreVersion = latestOfficialVersion
            logger.lifecycle("Using official KineticCore ${kineticCoreVersion}; local version is ${localKineticCoreVersion ?: 'not available'}.")
        } else if (localKineticCoreVersion) {
            kineticCoreVersion = localKineticCoreVersion
        }
    } else if (localKineticCoreVersion &&
            compareKineticCoreVersions(localKineticCoreVersion, kineticCoreVersion) > 0) {
        logger.lifecycle("Using local KineticCore ${localKineticCoreVersion} instead of the lower configured version ${kineticCoreVersion}.")
        kineticCoreVersion = localKineticCoreVersion
    }

    if (compareKineticCoreVersions(kineticCoreVersion, kineticCoreMinimumVersion) < 0) {
        throw new org.gradle.api.GradleException(
                "KineticCore build dependency ${kineticCoreVersion} must be at least ${kineticCoreMinimumVersion}.")
    }
    def kineticCoreDependency = fg.deobf("dev.xyat.kineticcore:kineticcore:${kineticCoreVersion}") { changing = true }
    implementation kineticCoreDependency
    kineticCoreReobf("dev.xyat.kineticcore:kineticcore:${kineticCoreVersion}") { changing = true }
    implementation fg.deobf("maven.modrinth:curios:IPQlZkz1")

    implementation fg.deobf("maven.modrinth:kubejs:g5igndAv")
    implementation fg.deobf("maven.modrinth:rhino:uNALdylI")
    implementation fg.deobf('dev.architectury:architectury-forge:9.2.14')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties =[
            minecraft_version           : project.findProperty('minecraft_version')?.toString(),
            minecraft_version_range     : project.findProperty('minecraft_version_range')?.toString(),
            forge_version               : project.findProperty('forge_version')?.toString(),
            forge_version_range         : project.findProperty('forge_version_range')?.toString(),
            loader_version_range        : project.findProperty('loader_version_range')?.toString(),
            kineticcore_version_range   : project.findProperty('kineticcore_version_range')?.toString(),
            curios_version_range        : project.findProperty('curios_version_range')?.toString(),
            kubejs_version_range        : project.findProperty('kubejs_version_range')?.toString(),
            mod_id                      : pModId,
            mod_name                    : project.findProperty('mod_name')?.toString(),
            mod_license                 : project.findProperty('mod_license')?.toString(),
            mod_version                 : pVersion,
            mod_authors                 : project.findProperty('mod_authors')?.toString(),
            mod_description             : project.findProperty('mod_description')?.toString()
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties +[
                project: project,
                file: [jarVersion: pVersion]
        ]
    }
}

tasks.named('jar', Jar).configure {
    def customOutputDir = project.findProperty('output_mods_dir')
    if (customOutputDir) {
        def outputPath = customOutputDir.toString()
        def windowsAbsolutePath = outputPath.length() >= 3
                && Character.isLetter(outputPath.charAt(0))
                && outputPath.charAt(1) == ':'
                && (outputPath.charAt(2) == '/' || outputPath.charAt(2) == '\\')
        def runningOnWindows = System.getProperty('os.name').toLowerCase().contains('windows')

        // Use the shared Windows output folder locally and Gradle's normal output folder on Linux CI.
        if (windowsAbsolutePath && !runningOnWindows) {
            destinationDirectory = layout.buildDirectory.dir('libs').get().asFile
        } else {
            destinationDirectory = file(outputPath)
        }
    }

    archiveFileName.set("${pModId}-${project.version}.jar")

    manifest {
        attributes([
                'Specification-Title'     : pModId,
                'Specification-Vendor'    : project.findProperty('mod_authors')?.toString() ?: "Unknown",
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : pVersion,
                'Implementation-Vendor'   : project.findProperty('mod_authors')?.toString() ?: "Unknown",
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.register('runClientIDE') {
    group = 'build'
    description = 'Start Forge development client (wrapper around runClient)'
    dependsOn 'runClient'
}

tasks.register('runServerIDE') {
    group = 'build'
    description = 'Start Forge development server (wrapper around runServer)'
    dependsOn 'runServer'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll([
            '-nowarn',
            '-Xlint:none',
            '-Amixin.target.allowUnresolvedTarget=true',
            '-Amixin.suppressTargetWarnings=true'
    ])
}
